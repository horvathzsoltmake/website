  <script>
  (function(){
    let overlay = null;
    function createOverlay(src){
      const o = document.createElement('div');
      o.className = 'lightbox-overlay';
      o.innerHTML = '<img src="'+src.replace(/"/g,'')+'" alt="">';
      document.body.appendChild(o);
      // allow CSS transition
      requestAnimationFrame(()=> o.classList.add('show'));
      // close on click
      o.addEventListener('click', closeOverlay);
      return o;
    }
    function closeOverlay(){
      if(!overlay) return;
      overlay.classList.remove('show');
      setTimeout(()=> { if(overlay){ overlay.remove(); overlay = null; } }, 220);
    }
    document.querySelectorAll('.frame').forEach(frame=>{
      frame.addEventListener('click', (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const img = frame.querySelector('img');
        if(!img) return;
        // if overlay already open, close it
        if(overlay){ closeOverlay(); return; }
        overlay = createOverlay(img.src);
      });
    });
    document.addEventListener('keydown', e=>{
      if(e.key === 'Escape') closeOverlay();
    });
  })();
  </script>

  </script>
